<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="./space-images/galaxy.jpg">
    <title>Planet Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #050510; padding-bottom: 50px; color: #e0e0e0; font-family: 'Space Grotesk', sans-serif;}
        
        /* Background Star Canvas */
        #starfield { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }

        /* Huge Planet Image */
        .hero-image-container {
            text-align: center;
            padding: 40px 0;
            position: relative;
        }
        .hero-image-container img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(0, 210, 255, 0.4);
            border: 3px solid #00d2ff;
            transition: transform 0.5s ease;
        }
        .hero-image-container img:hover {
            transform: scale(1.05);
        }
        
        /* Title Section */
        .planet-title {
            text-align: center;
            margin-bottom: 40px;
        }
        .planet-title h1 { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; color: #fff; text-shadow: 0 0 20px #00d2ff; margin-bottom: 10px;}
        .planet-title p { font-size: 1.2rem; color: #00d2ff; letter-spacing: 2px; text-transform: uppercase;}

        /* Description & Info Box */
        .info-box {
            background: rgba(20, 25, 45, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .info-box h3 {
            color: #00d2ff;
            font-family: 'Orbitron', sans-serif;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .info-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #cccccc;
            margin-bottom: 15px;
        }

        .info-text strong {
            color: #fff;
        }

        /* Navigation button */
        .back-btn {
            position: fixed; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 210, 255, 0.2); border: 1px solid #00d2ff;
            color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none;
            backdrop-filter: blur(5px); font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
        }
        .back-btn:hover { background: #00d2ff; color: #000; }
    </style>
</head>
<body>

    <!-- Moving Stars Background -->
    <canvas id="starfield"></canvas>

    <a href="index.html" class="back-btn">← Back</a>

    <div class="container" id="details-container" style="padding-top: 60px;">
        <!-- Details will be injected here by JS -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

        <!-- Responsive Footer -->
    <footer class="footer-custom mt-auto py-4">
        <div class="container text-center">
            <div class="row justify-content-center align-items-center">
                <div class="col-md-6 mb-2 mb-md-0">
                    <p class="mb-0 text-light">
                        &copy; 2026 Solar System Explorer. All Rights Reserved.
                    </p>
                </div>
                <div class="col-md-6 text-md-end text-center">
                    <p class="mb-0 text-light">
                        Powered by <a href="https://www.facebook.com/profile.php?id=61596213878241" class="dev-link" target="_blank">Tech Solutions WebStratix</a>
                    </p>
                </div>
            </div>
        </div>
    </footer>


    <!-- Webinspect Off code -->
     <script>
    // 1. Right Click Block
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // 2. F12 ar Developer Tools Shortcut Block
    document.addEventListener('keydown', function(e) {
        // F12 block
        if (e.key === "F12" || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }
        
        // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C block
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
            e.preventDefault();
            return false;
        }

        // Ctrl+U (View Source) block
        if (e.ctrlKey && (e.key === 'U' || e.keyCode === 85)) {
            e.preventDefault();
            return false;
        }
    });

    // 3. Extra Security (Jodi keu Inspector already open kore rakhe)
    setInterval(function() {
        // eslint-disable-next-line no-debugger
        debugger; 
    }, 1000); // Prottek 1 second e code ta break korbe jodi dev tools open thake
    document.addEventListener('copy', function(e) {
        e.preventDefault();
        alert("Copying is disabled on this website.");
    });
</script>
</body>
</html>
