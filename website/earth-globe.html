<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/jpeg" href="./space-images/galaxy.jpg">
    <title>Earth 3D Globe - Interactive with Borders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Space Grotesk', sans-serif;}
        #globe-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1;}

        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff;
            color: #00d2ff; padding: 10px 20px; border-radius: 8px; text-decoration: none;
            backdrop-filter: blur(10px); font-family: 'Orbitron', sans-serif; transition: 0.3s;
        }
        .back-btn:hover { background: #00d2ff; color: #000; box-shadow: 0 0 15px #00d2ff;}
        
        .title-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; text-align: center; color: white; pointer-events: none;
        }
        .title-overlay h1 {
            font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
        }

        .search-panel {
            position: absolute; top: 100px; left: 20px;
            z-index: 20; width: 320px;
            background: rgba(10, 20, 35, 0.85);
            border: 1px solid #00d2ff;
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
        }
        .search-title {
            color: #00d2ff; font-family: 'Orbitron', sans-serif;
            font-size: 1rem; font-weight: bold; margin-bottom: 15px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3); padding-bottom: 5px;
        }
        .search-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 210, 255, 0.5);
            color: #fff;
            border-radius: 8px;
            padding: 10px 15px;
            width: 100%;
            margin-bottom: 10px;
        }
        .search-input:focus {
            background: rgba(0, 0, 0, 0.8);
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            color: #fff;
            outline: none;
        }
        .search-btn {
            background: #00d2ff; color: #000;
            border: none; border-radius: 8px;
            padding: 10px; width: 100%;
            font-weight: bold; transition: 0.3s;
        }
        .search-btn:hover {
            background: #fff; color: #00d2ff;
            box-shadow: 0 0 15px #00d2ff;
        }

        .suggestions-box {
            position: absolute; top: 100%; left: 0; width: 100%;
            background: rgba(10, 20, 35, 0.95);
            border: 1px solid #00d2ff;
            border-radius: 0 0 10px 10px;
            max-height: 150px; overflow-y: auto;
            display: none; z-index: 30;
        }
        .suggestion-item {
            padding: 8px 15px; color: #fff; cursor: pointer; transition: 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }
        .suggestion-item:hover {
            background: rgba(0, 210, 255, 0.2); color: #00d2ff;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00d2ff; font-family: 'Orbitron', sans-serif; font-size: 1.5rem; z-index: 100;
            text-align: center;
        }
        .spinner-border { color: #00d2ff; width: 3rem; height: 3rem; }

        .country-label {
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 0 5px #000, 0 0 5px #000;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            white-space: nowrap;
            transition: opacity 0.2s ease, transform 0.2s ease; 
        }

        @media (max-width: 768px) {
            .search-panel { top: auto; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; }
            .title-overlay h1 { font-size: 1.5rem; }
            .title-overlay p { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner-border" role="status"></div>
        <div class="mt-3">Loading Borders...</div>
    </div>

    <a href="index.html" class="back-btn">← Back</a>
    <div class="title-overlay">
        <h1>PLANET EARTH</h1>
        <p class="text-info">Drag to rotate • Search to explore</p>
    </div>

    <div class="search-panel" id="searchPanel">
        <div class="search-title">FIND A COUNTRY</div>
        <div style="position: relative;">
            <input type="text" id="countrySearch" class="search-input" placeholder="Type country name..." autocomplete="off">
            <div class="suggestions-box" id="suggestionsBox"></div>
        </div>
        <button class="search-btn" onclick="searchCountry()">Search & Explore</button>
    </div>
    
    <div id="globe-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DObject.js"></script>
    
    <script>
    const container = document.getElementById('globe-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const labelRenderer = new THREE.CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    container.appendChild(labelRenderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 7;
    controls.maxDistance = 30;
    controls.rotateSpeed = 0.5;

    // ==========================================
    // --- NEW FEATURE: AUTO-ROTATE SETUP ---
    // ==========================================
    controls.autoRotate = true; 
    controls.autoRotateSpeed = 0.5; 

    let rotationTimeout;
    controls.addEventListener('start', () => {
        controls.autoRotate = false; 
        clearTimeout(rotationTimeout);
    });
    controls.addEventListener('end', () => {
        rotationTimeout = setTimeout(() => {
            controls.autoRotate = true; 
        }, 3000); 
    });
    // ==========================================

    scene.add(new THREE.AmbientLight(0xffffff, 0.6)); 
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(5, 3, 5); 
    scene.add(sunLight);

    const textureLoader = new THREE.TextureLoader();
    
    const earthMap = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';
    const cloudMap = 'https://threejs.org/examples/textures/planets/earth_clouds_1024.png'; 

    const earthGeometry = new THREE.SphereGeometry(5, 64, 64);
    const earthMaterial = new THREE.MeshPhongMaterial({
        map: textureLoader.load(earthMap, () => {
            document.getElementById('loading').style.display = 'none';
        }),
        shininess: 10
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);

    const cloudGeometry = new THREE.SphereGeometry(5.05, 64, 64);
    const cloudMaterial = new THREE.MeshLambertMaterial({
        map: textureLoader.load(cloudMap), transparent: true, opacity: 0.3,
        blending: THREE.AdditiveBlending, side: THREE.DoubleSide
    });
    const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
    scene.add(clouds);

    const atmosphereGeometry = new THREE.SphereGeometry(5.2, 64, 64);
    const atmosphereMaterial = new THREE.MeshBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.1, side: THREE.BackSide });
    scene.add(new THREE.Mesh(atmosphereGeometry, atmosphereMaterial));

    const starsGeometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(3000 * 3);
    for(let i = 0; i < 3000 * 3; i++) posArray[i] = (Math.random() - 0.5) * 200; 
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.1, color: 0xffffff })));

    // --- 1. GEOJSON BORDERS ---
    const bordersUrl = 'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json';

    fetch(bordersUrl)
        .then(response => response.json())
        .then(data => {
            const borderMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00d2ff, 
                transparent: true, 
                opacity: 0.5 
            });

            data.features.forEach(feature => {
                const geometry = feature.geometry;
                
                if (geometry.type === 'Polygon') {
                    geometry.coordinates.forEach(ring => {
                        const points = ring.map(coord => {
                            const lat = coord[1];
                            const lon = coord[0];
                            return latLongToVector3(lat, lon, 5.01);
                        });
                        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                        const line = new THREE.Line(lineGeo, borderMaterial);
                        earth.add(line);
                    });
                } else if (geometry.type === 'MultiPolygon') {
                    geometry.coordinates.forEach(polygon => {
                        polygon.forEach(ring => {
                            const points = ring.map(coord => {
                                const lat = coord[1];
                                const lon = coord[0];
                                return latLongToVector3(lat, lon, 5.01);
                            });
                            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                            const line = new THREE.Line(lineGeo, borderMaterial);
                            earth.add(line);
                        });
                    });
                }
            });
        })
        .catch(err => console.error("Error loading borders:", err));

    function latLongToVector3(lat, lon, radius) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);
        const x = -(radius * Math.sin(phi) * Math.cos(theta));
        const z = (radius * Math.sin(phi) * Math.sin(theta));
        const y = (radius * Math.cos(phi));
        return new THREE.Vector3(x, y, z);
    }

    // --- 2. Country Data ---
    const countryLabels = [];
    const countries = [
        { name: "USA", lat: 37.0902, lon: -95.7129 },
        { name: "Canada", lat: 56.1304, lon: -106.3468 },
        { name: "Brazil", lat: -14.2350, lon: -51.9253 },
        { name: "Argentina", lat: -38.4161, lon: -63.6167 },
        { name: "UK", lat: 55.3781, lon: -3.4360 },
        { name: "France", lat: 46.2276, lon: 2.2137 },
        { name: "Germany", lat: 51.1657, lon: 10.4515 },
        { name: "Spain", lat: 40.4637, lon: -3.7492 },
        { name: "Italy", lat: 41.8719, lon: 12.5674 },
        { name: "Russia", lat: 61.5240, lon: 105.3188 },
        { name: "China", lat: 35.8617, lon: 104.1954 },
        { name: "India", lat: 20.5937, lon: 78.9629 },
        { name: "Japan", lat: 36.2048, lon: 138.2529 },
        { name: "Australia", lat: -25.2744, lon: 133.7751 },
        { name: "South Africa", lat: -30.5595, lon: 22.9375 },
        { name: "Egypt", lat: 26.8206, lon: 30.8025 },
        { name: "Saudi Arabia", lat: 23.8859, lon: 45.0792 },
        { name: "Indonesia", lat: -0.7893, lon: 113.9213 },
        { name: "Bangladesh", lat: 23.6850, lon: 90.3563 },
        { name: "Pakistan", lat: 30.3753, lon: 69.3451 }
    ];

    countries.forEach(country => {
        const div = document.createElement('div');
        div.className = 'country-label';
        div.textContent = country.name;
        const label = new THREE.CSS2DObject(div);
        
        const pos = latLongToVector3(country.lat, country.lon, 5.02); 
        label.position.copy(pos);
        earth.add(label); 
        
        countryLabels.push({
            name: country.name,
            mesh: label,
            lat: country.lat,
            lon: country.lon
        });
    });

    // --- 3. Search Logic ---
    const searchInput = document.getElementById('countrySearch');
    const suggestionsBox = document.getElementById('suggestionsBox');

    searchInput.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        suggestionsBox.innerHTML = '';
        if (!val) { suggestionsBox.style.display = 'none'; return; }

        const filtered = countries.filter(c => c.name.toLowerCase().includes(val));
        if (filtered.length > 0) {
            suggestionsBox.style.display = 'block';
            filtered.forEach(c => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = c.name;
                div.onclick = () => {
                    searchInput.value = c.name;
                    suggestionsBox.style.display = 'none';
                    goToCountry(c);
                };
                suggestionsBox.appendChild(div);
            });
        } else {
            suggestionsBox.style.display = 'none';
        }
    });

    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.style.display = 'none';
        }
    });

    function searchCountry() {
        const val = searchInput.value.toLowerCase();
        const found = countries.find(c => c.name.toLowerCase() === val);
        if (found) {
            goToCountry(found);
        } else {
            alert("Country not found!");
        }
    }

    function goToCountry(country) {
        // Auto-rotate off koro jate search er somoy na ghure
        controls.autoRotate = false;
        clearTimeout(rotationTimeout);
        
        // After search, 5 seconds por auto rotate on hobe
        setTimeout(() => { controls.autoRotate = true; }, 5000);

        const targetVector = latLongToVector3(country.lat, country.lon, 5);
        const targetRotationY = Math.atan2(targetVector.x, targetVector.z);

        const startRotY = earth.rotation.y;
        let endRotY = targetRotationY; 
        
        let diff = endRotY - startRotY;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        const startTime = performance.now();
        const duration = 1500;

        function animateRotation(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
            
            earth.rotation.y = startRotY + diff * ease;
            clouds.rotation.y = earth.rotation.y + 0.05; 

            if (progress < 1) {
                requestAnimationFrame(animateRotation);
            }
        }
        requestAnimationFrame(animateRotation);

        countryLabels.forEach(item => {
            if (item.name === country.name) {
                item.mesh.element.style.color = '#00d2ff';
                item.mesh.element.style.borderColor = '#00d2ff';
                item.mesh.element.style.transform = 'scale(1.5)';
                item.mesh.element.style.backgroundColor = 'rgba(0, 210, 255, 0.4)';
                item.mesh.element.style.zIndex = '999';
            } else {
                item.mesh.element.style.color = '#ffffff';
                item.mesh.element.style.borderColor = 'rgba(0, 210, 255, 0.4)';
                item.mesh.element.style.transform = 'scale(1)';
                item.mesh.element.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
                item.mesh.element.style.zIndex = '1';
            }
        });
    }

    // --- 4. Visibility Check ---
    const tempV = new THREE.Vector3();
    const cameraToPoint = new THREE.Vector3();
    const cameraDir = new THREE.Vector3();

    function animate() {
        requestAnimationFrame(animate);
        
        camera.getWorldDirection(cameraDir);

        countryLabels.forEach(item => {
            item.mesh.getWorldPosition(tempV);
            cameraToPoint.subVectors(tempV, camera.position).normalize();
            
            const dot = cameraDir.dot(cameraToPoint);
            
            if (dot > 0.1) {
                item.mesh.element.style.opacity = 1;
                item.mesh.element.style.display = "block";
            } else {
                item.mesh.element.style.opacity = 0;
                item.mesh.element.style.display = "none";
            }
        });

        controls.update();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>

    <!-- Web inspect Off code -->
     <script>
    // 1. Right Click Block
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // 2. F12 ar Developer Tools Shortcut Block
    document.addEventListener('keydown', function(e) {
        // F12 block
        if (e.key === "F12" || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }
        
        // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C block
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
            e.preventDefault();
            return false;
        }

        // Ctrl+U (View Source) block
        if (e.ctrlKey && (e.key === 'U' || e.keyCode === 85)) {
            e.preventDefault();
            return false;
        }
    });

    // 3. Extra Security (Jodi keu Inspector already open kore rakhe)
    setInterval(function() {
        // eslint-disable-next-line no-debugger
        debugger; 
    }, 1000); // Prottek 1 second e code ta break korbe jodi dev tools open thake
    document.addEventListener('copy', function(e) {
        e.preventDefault();
        alert("Copying is disabled on this website.");
    });
</script>
</body>
</html>
